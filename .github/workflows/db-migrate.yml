name: DB - Generar y aplicar migraciones

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Generar migración a partir de db/schema.ts
        run: npx drizzle-kit generate

      - name: Commitear la migración generada (si hay cambios)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git add drizzle
            git commit -m "chore: generar migración de base de datos"
            git push
          else
            echo "Sin cambios de esquema, nada que generar."
          fi

      - name: Aplicar migraciones a D1 (producción)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply escribir-cd-db --remote
