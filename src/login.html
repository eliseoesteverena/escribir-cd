<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Iniciar sesión — escribirCD</title>

    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="escribirCD" />

    <link rel="stylesheet" href="./css/tailwind.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..700&display=swap" rel="stylesheet">

    <!-- DIAGNÓSTICO TEMPORAL: consola visible en el celular. Sacar cuando
         se resuelva el 500 del signup. -->
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script>var vConsole = new VConsole();</script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

    <header class="w-full bg-white border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="h-16 flex items-center">
                <a href="./" class="flex items-center shrink-0">
                    <span class="text-xl font-extrabold tracking-tight text-gray-900">
                        escribir<span class="text-blue-600">CD</span>
                    </span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-12">
        <div class="bg-white border rounded-xl shadow-sm p-6 sm:p-8">

            <!-- Tabs -->
            <div class="flex mb-6 border-b border-gray-100">
                <button type="button" id="tab-signin" class="flex-1 pb-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition-colors">
                    Iniciar sesión
                </button>
                <button type="button" id="tab-signup" class="flex-1 pb-3 text-sm font-semibold text-gray-400 border-b-2 border-transparent transition-colors">
                    Crear cuenta
                </button>
            </div>

            <p id="auth-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2 mb-4 whitespace-pre-wrap break-words"></p>

            <!-- Iniciar sesión -->
            <form id="form-signin" class="space-y-4">
                <div>
                    <label for="signin-email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="signin-email" required autocomplete="email"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
                </div>
                <div>
                    <label for="signin-password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="signin-password" required autocomplete="current-password"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-medium py-2.5 rounded-lg transition-colors">
                    Iniciar sesión
                </button>
            </form>

            <!-- Crear cuenta -->
            <form id="form-signup" class="space-y-4 hidden">
                <div>
                    <label for="signup-name" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                    <input type="text" id="signup-name" required autocomplete="name"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
                </div>
                <div>
                    <label for="signup-email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="signup-email" required autocomplete="email"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
                </div>
                <div>
                    <label for="signup-password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="signup-password" required autocomplete="new-password" minlength="8"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
                    <p class="text-xs text-gray-400 mt-1">Mínimo 8 caracteres.</p>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-medium py-2.5 rounded-lg transition-colors">
                    Crear cuenta
                </button>
            </form>

        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/login-page.js"></script>
</body>
</html>
